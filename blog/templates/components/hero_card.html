{% if featured_post.image_cover %}
    <div class="h-64 md:h-full min-h-62.5">
        <img src="{{ featured_post.image_cover.url }}" class="w-full h-full max-h-125 object-cover" alt="{{ featured_post.title }}">
    </div>
{% endif %}
<div class="p-6 md:p-12 flex flex-col justify-center">
    <span class="text-xs font-bold text-brand-terracotta uppercase tracking-widest bg-brand-light px-3 py-1 rounded-full self-start mb-4">Última Novidade</span>
    <h1 class="font-display text-2xl md:text-4xl font-bold mb-4 text-brand-dark">
        <a href="{% url 'blog:detail' featured_post.slug %}" class="hover:text-brand-terracotta transition">
            {{ featured_post.title }}
        </a>
    </h1>
    <p class="text-brand-dark/70 mb-6 text-sm md:text-base">{{ featured_post.description }}</p>
    <a href="{% url 'blog:detail' featured_post.slug %}" class="bg-brand-terracotta text-white text-center text-sm font-semibold px-6 py-3 rounded-full hover:bg-brand-dark transition md:self-start">
        Ler o Primeiro Artigo
    </a>
</div>
