{% extends 'base.html' %}

{% block title %}Página não encontrada{% endblock title %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-16 md:py-24">
    <div class="bg-white rounded-3xl border border-brand-blush/20 shadow-sm p-8 md:p-16 text-center">
        <span class="inline-flex items-center justify-center px-4 py-2 rounded-full bg-brand-light text-brand-dark text-xs font-bold uppercase tracking-[0.2em]">
            Erro 404
        </span>

        <h1 class="font-display text-6xl md:text-8xl font-bold tracking-[-0.08em] text-brand-terracotta mt-6 mb-4">
            404
        </h1>

        <p class="max-w-xl mx-auto text-base md:text-lg text-brand-dark/70 leading-relaxed mb-8">
            A página que você tentou acessar não foi encontrada.
            Talvez ela foi removida, renomeada ou nunca existiu.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="/" class="bg-brand-terracotta text-white text-sm font-semibold px-6 py-3 rounded-full hover:bg-brand-dark transition inline-flex items-center justify-center">
                Voltar para a home
            </a>
            <button type="button" onclick="history.back()" class="bg-brand-light text-brand-dark text-sm font-semibold px-6 py-3 rounded-full hover:bg-brand-blush transition">
                Voltar para a página anterior
            </button>
        </div>
    </div>
</div>
{% endblock %}
