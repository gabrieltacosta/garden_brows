name: gardenbrows

services:
  db:
    image: postgres:16-alpine
    container_name: blog_db
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: blog_redis_cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
    - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "redis-cli -h localhost -p 6379 ping"
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  # media_data:   
  #   driver: local
