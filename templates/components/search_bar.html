<form action="{% url 'blog:archive' %}" method="get" class="relative flex items-center w-full">
    <div class="relative w-full flex items-center">
        <!-- Ícone centralizado verticalmente com flex -->
        <span class="absolute left-3 flex items-center justify-center pointer-events-none text-brand-dark/40">
            <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </span>
        <input type="text" 
               name="q" 
               value="{{ request.GET.q|default:'' }}"
               placeholder="Buscar artigos..." 
               class="w-full pl-9 pr-4 py-2 text-xs md:text-sm bg-brand-light/60 border border-brand-blush/30 rounded-full focus:outline-none focus:border-brand-terracotta focus:bg-white transition text-brand-dark placeholder:text-brand-dark/40 shadow-xs">
    </div>
</form>
