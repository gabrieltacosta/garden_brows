{% if GA_MEASUREMENT_ID %}
    <script>
        window.GA_MEASUREMENT_ID = "{{ GA_MEASUREMENT_ID }}";
        
        window.initGoogleAnalytics = function() {
            if (window.gaLoaded) return;
            window.gaLoaded = true;

            const script = document.createElement('script');
            script.async = true;
            script.src = `https://www.googletagmanager.com/gtag/js?id=${window.GA_MEASUREMENT_ID}`;
            document.head.appendChild(script);

            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            window.gtag = gtag;
            
            gtag('js', new Date());
            gtag('config', window.GA_MEASUREMENT_ID, {
                'cookie_domain': 'auto',
                'cookie_flags': 'SameSite=Lax;Secure',
                'cookie_update': true
            });
            console.log("Google Analytics carregado com sucesso!");
        }

        // Verifica também após a página carregar: o banner pode salvar o
        // consentimento depois que este script já tiver sido executado.
        let consentCheck;
        function checkCookieConsent() {
            try {
                if (localStorage.getItem('cookie_consent') === 'accepted') {
                    window.initGoogleAnalytics();
                    if (consentCheck) clearInterval(consentCheck);
                }
            } catch (error) {
                // localStorage pode estar indisponível no navegador.
            }
        }

        checkCookieConsent();
        consentCheck = setInterval(checkCookieConsent, 500);
        window.addEventListener('storage', checkCookieConsent);
    </script>
{% endif %}
